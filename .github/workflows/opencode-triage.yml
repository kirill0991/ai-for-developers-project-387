name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    # issues opened by bots (including the agent itself) are not triaged
    if: github.event.issue.user.type != 'Bot' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - name: Checkout repository
        if: steps.check.outputs.result == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Triage issue
        if: steps.check.outputs.result == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # nobody answers permission prompts in CI: an "ask" hangs the job, so deny instead
          OPENCODE_CONFIG_CONTENT: '{"permission":{"edit":"deny","bash":"deny","webfetch":"deny","external_directory":"deny","question":"deny","doom_loop":"deny"}}'
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/big-pickle' }}
          # read-only agent: the action pushes any file change as a pull request
          agent: plan
          share: false
          prompt: |
            В репозитории появилась новая задача. Это сервис бронирования звонков:
            фронтенд на React в `src/` (Feature-Sliced Design), бэкенд на Fastify
            и SQLite в `server/`, API-контракт в `spec/main.tsp`. Задачи обычно
            описаны как жалоба пользователя, без готового решения.

            Сделай первичный разбор и оставь в issue один комментарий на русском
            со следующими разделами:

            1. **Суть** — что не так, одной-двумя фразами своими словами.
            2. **Причина** — почему это происходит, со ссылками на конкретные
               файлы и функции (`путь:строка`). Если причину по коду установить
               нельзя, так и напиши и перечисли, что проверил.
            3. **Затронутые части** — какие слои придётся менять: спецификация,
               сервер, клиент, тесты.
            4. **Предлагаемый путь** — один рекомендуемый вариант исправления и,
               если есть, альтернатива с её минусом.
            5. **Открытые вопросы** — что должен решить владелец до начала работы.
            6. **Метка** — одна из `ready-for-agent`, `ready-for-human`,
               `needs-info`, `wontfix` и почему.

            Не меняй код, не создавай ветки и pull request'ы: только комментарий.
