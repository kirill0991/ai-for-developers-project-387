name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # nobody answers permission prompts in CI: an "ask" hangs the job, so deny instead
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":"deny"}}'
        with:
          model: ${{ vars.OPENCODE_MODEL || 'openrouter/openrouter/free' }}
          mentions: /opencode,/oc
