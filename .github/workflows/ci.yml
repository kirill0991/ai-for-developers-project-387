name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t calendar-app .
      - name: Start the container on a custom PORT
        run: docker run -d --name app -e PORT=8080 -p 8080:8080 calendar-app
      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/event-types && exit 0
            sleep 1
          done
          docker logs app
          exit 1
      - name: Check that the frontend is served
        run: |
          curl -sf -H 'Accept: text/html' http://localhost:8080/bookings | grep -q '<div id="root">'
